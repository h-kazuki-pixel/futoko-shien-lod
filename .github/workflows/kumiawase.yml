# 組み合わせの例(e-Stat 統計LOD と、標準地域コードで並べる)。手で起動する。
name: kumiawase
on:
  workflow_dispatch:
    inputs:
      args:
        description: "python -m futoko_lod.kumiawase に渡すもの"
        default: "--probe 40219"
permissions:
  contents: write
  actions: write
jobs:
  kumiawase:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m futoko_lod.kumiawase ${{ inputs.args }}
      - name: 書き出したものがあればコミットして、公開のページを作り直す
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/kumiawase 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "書き出したものは無い"
          else
            git commit -m "組み合わせの例: e-Stat 統計LOD から引いた児童数・生徒数($(date -u +%F))"
            git pull --rebase origin main
            git push origin HEAD:main
            gh workflow run pages.yml --ref main
          fi
