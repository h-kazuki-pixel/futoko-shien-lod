# 「なし」の照合の対照。学びの多様化学校の「なし」が、空振りで通っていないかを確かめる。手で起動する。
# 文部科学省の一覧を1回だけ取りに行く。ページの本文は出さない。
name: taishou
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: shougou
  cancel-in-progress: false
jobs:
  taishou:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m futoko_lod.taishou --summary "$GITHUB_STEP_SUMMARY"
